<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Spesa di Casa</title>
<meta name="description" content="Gestione della lista della spesa e dello storico acquisti di casa" />
<meta name="theme-color" content="#2f7a4d" />
<link rel="manifest" href="manifest.json" />
<link rel="icon" href="icons/icon-192.png" />
<link rel="apple-touch-icon" href="icons/icon-192.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Spesa" />
<link rel="stylesheet" href="css/style.css" />
</head>
<body>

<div id="login-screen" class="screen">
  <div class="login-card">
    <h1>🛒 Spesa di Casa</h1>
    <p>Accedi con il tuo account Google per vedere la lista della spesa condivisa.</p>
    <button id="google-login-btn" class="btn btn-primary btn-google">
      <svg width="18" height="18" viewBox="0 0 18 18"><path fill="#4285F4" d="M17.64 9.2c0-.64-.06-1.25-.16-1.84H9v3.48h4.84a4.14 4.14 0 0 1-1.8 2.72v2.26h2.91c1.7-1.57 2.69-3.88 2.69-6.62z"/><path fill="#34A853" d="M9 18c2.43 0 4.47-.8 5.96-2.18l-2.91-2.26c-.81.54-1.84.86-3.05.86-2.34 0-4.33-1.58-5.04-3.71H.96v2.33A9 9 0 0 0 9 18z"/><path fill="#FBBC05" d="M3.96 10.71A5.4 5.4 0 0 1 3.68 9c0-.59.1-1.17.28-1.71V4.96H.96A9 9 0 0 0 0 9c0 1.45.35 2.83.96 4.04l3-2.33z"/><path fill="#EA4335" d="M9 3.58c1.32 0 2.51.46 3.44 1.35l2.58-2.58C13.46.89 11.43 0 9 0A9 9 0 0 0 .96 4.96l3 2.33C4.67 5.16 6.66 3.58 9 3.58z"/></svg>
      Accedi con Google
    </button>
    <p id="login-error" class="error-text" hidden></p>
  </div>
</div>

<div id="app" class="screen" hidden>
  <header class="app-header">
    <h1>🛒 Spesa di Casa</h1>
    <div class="user-chip">
      <img id="user-photo" src="" alt="" />
      <span id="user-name"></span>
      <button id="logout-btn" class="icon-btn" title="Esci">⎋</button>
    </div>
  </header>

  <nav class="tabs">
    <button class="tab-btn active" data-tab="list">Lista della spesa</button>
    <button class="tab-btn" data-tab="history">Storico acquisti</button>
  </nav>

  <main>
    <!-- LISTA DELLA SPESA -->
    <section id="tab-list" class="tab-panel active">
      <form id="add-item-form" class="add-item-form" autocomplete="off">
        <div class="add-item-row">
          <input type="text" id="product-input" placeholder="Aggiungi prodotto (es. Spaghetti)" required list="product-suggestions" />
          <datalist id="product-suggestions"></datalist>
          <select id="category-select" required></select>
          <button type="submit" class="btn btn-primary">+</button>
        </div>
        <div id="last-purchase-hint" class="hint" hidden></div>
      </form>

      <div class="list-toolbar">
        <span id="list-count" class="muted"></span>
        <button id="clear-purchased-btn" class="btn btn-ghost" hidden>Svuota comprati</button>
      </div>

      <div id="shopping-list" class="grouped-list"></div>
      <p id="list-empty" class="empty-state" hidden>Lista vuota. Aggiungi il primo prodotto! 🎉</p>
    </section>

    <!-- STORICO -->
    <section id="tab-history" class="tab-panel">
      <div class="history-search">
        <input type="text" id="history-search-input" placeholder="Cerca nello storico…" />
      </div>
      <div id="history-list" class="history-list"></div>
      <p id="history-empty" class="empty-state" hidden>Nessun acquisto registrato ancora.</p>
    </section>
  </main>
</div>

<!-- MODALE: segna come comprato -->
<div id="purchase-modal" class="modal-overlay" hidden>
  <div class="modal">
    <h2 id="purchase-modal-title">Segna come comprato</h2>
    <form id="purchase-form">
      <label>Marca
        <input type="text" id="purchase-brand" placeholder="es. Barilla" />
      </label>
      <label>Formato
        <input type="text" id="purchase-size" placeholder="es. 500gr" />
      </label>
      <label>Prezzo (€)
        <input type="number" id="purchase-price" step="0.01" min="0" placeholder="es. 1.49" />
      </label>
      <div id="purchase-last-hint" class="hint" hidden></div>
      <div class="modal-actions">
        <button type="button" id="purchase-cancel-btn" class="btn btn-ghost">Annulla</button>
        <button type="button" id="purchase-simple-btn" class="btn btn-ghost">Solo segna comprato</button>
        <button type="submit" class="btn btn-primary">Salva</button>
      </div>
    </form>
  </div>
</div>

<div id="toast" class="toast" hidden></div>

<script type="module" src="js/app.js"></script>
</body>
</html>
